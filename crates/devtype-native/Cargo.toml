[package]
name = "devtype-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
gittype = { path = "../gittype" }
napi = { version = "3.12.7", features = ["napi8", "serde-json"] }
napi-derive = "3.6.8"
serde_json = "1.0"
crossterm = "0.29"
shaku = "0.6"
ratatui = "0.30"
log = "0.4"
clap = "4.6"
anyhow = "1.0"
tokio = { version = "1.50", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2.4.4"
